<svg xmlns="http://www.w3.org/2000/svg" width="301" height="301" fill="none" viewBox="0 0 301 301">
  <defs>

    <!-- Outer border gradient: bright gold highlight on top-left, darker on bottom-right -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="301" y2="301" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE580"/>
      <stop offset="20%"  stop-color="#E8A800"/>
      <stop offset="45%"  stop-color="#C87800"/>
      <stop offset="70%"  stop-color="#B06000"/>
      <stop offset="100%" stop-color="#7A3D00"/>
    </linearGradient>

    <!-- Inner fill gradient: bright gold top fading to deep amber/brown at bottom -->
    <linearGradient id="fillGrad" x1="150" y1="30" x2="150" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D4850A"/>
      <stop offset="30%"  stop-color="#C47200"/>
      <stop offset="65%"  stop-color="#A05500"/>
      <stop offset="100%" stop-color="#6B3200"/>
    </linearGradient>

    <!-- Sheen overlay: light sweep across center -->
    <linearGradient id="sheenGrad" x1="80" y1="60" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE88A" stop-opacity="0.55"/>
      <stop offset="40%"  stop-color="#FFD050" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7A3D00" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#3D1800" flood-opacity="0.7" result="flood"/>
      <feComposite in="flood" in2="SourceGraphic" operator="in" result="shadow"/>
      <feGaussianBlur in="shadow" stdDeviation="8" result="blurShadow"/>
      <feComposite in="blurShadow" in2="SourceGraphic" operator="atop"/>
    </filter>

    <!-- Drop shadow for the whole shape -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- The shape path used as clip -->
    <clipPath id="shapeClip">
      <path d="M149.23 0c.666 16.513 14.216 29.708 30.87 29.804H195.365c20.084 0 36.51 15.664 37.729 35.441 20.659.253 37.328 17.079 37.328 37.798l.001 14.902-.001.182.001.182c.095 16.654 13.29 30.205 29.804 30.87v.05c-16.514.665-29.709 14.216-29.804 30.87l-.001.063v.224l.001.077-.001 14.901c0 20.085-15.664 36.511-35.442 37.729-.253 20.659-17.078 37.329-37.797 37.329h-15.266c-16.654.095-30.204 13.291-30.869 29.805h-.051l-.041-.772c-1.048-16.151-14.435-28.939-30.829-29.033h-15.266c-20.084 0-36.51-15.664-37.728-35.442-20.659-.253-37.328-17.079-37.328-37.798v-15.266C29.709 165.262 16.513 151.712 0 151.047v-.051c16.513-.665 29.71-14.216 29.805-30.87V104.86c0-20.084 15.663-36.51 35.441-37.728.254-20.659 17.08-37.327 37.798-37.327l14.902-.001h.364c16.654-.095 30.205-13.29 30.87-29.804h.05Z"/>
    </clipPath>

  </defs>

  <!-- Drop shadow layer -->
  <g filter="url(#dropShadow)">
    <!-- Border: slightly scaled-up version for the thick gold rim -->
    <path fill="url(#borderGrad)"
      d="M149.23 0c.666 16.513 14.216 29.708 30.87 29.804H195.365c20.084 0 36.51 15.664 37.729 35.441 20.659.253 37.328 17.079 37.328 37.798l.001 14.902-.001.182.001.182c.095 16.654 13.29 30.205 29.804 30.87v.05c-16.514.665-29.709 14.216-29.804 30.87l-.001.063v.224l.001.077-.001 14.901c0 20.085-15.664 36.511-35.442 37.729-.253 20.659-17.078 37.329-37.797 37.329h-15.266c-16.654.095-30.204 13.291-30.869 29.805h-.051l-.041-.772c-1.048-16.151-14.435-28.939-30.829-29.033h-15.266c-20.084 0-36.51-15.664-37.728-35.442-20.659-.253-37.328-17.079-37.328-37.798v-15.266C29.709 165.262 16.513 151.712 0 151.047v-.051c16.513-.665 29.71-14.216 29.805-30.87V104.86c0-20.084 15.663-36.51 35.441-37.728.254-20.659 17.08-37.327 37.798-37.327l14.902-.001h.364c16.654-.095 30.205-13.29 30.87-29.804h.05Z"/>
  </g>

  <!-- Inner fill (inset ~12px using stroke trick via scale) -->
  <g clip-path="url(#shapeClip)">
    <!-- Fill background -->
    <path fill="url(#fillGrad)"
      transform="translate(150.1,150.1) scale(0.918) translate(-150.1,-150.1)"
      d="M149.23 0c.666 16.513 14.216 29.708 30.87 29.804H195.365c20.084 0 36.51 15.664 37.729 35.441 20.659.253 37.328 17.079 37.328 37.798l.001 14.902-.001.182.001.182c.095 16.654 13.29 30.205 29.804 30.87v.05c-16.514.665-29.709 14.216-29.804 30.87l-.001.063v.224l.001.077-.001 14.901c0 20.085-15.664 36.511-35.442 37.729-.253 20.659-17.078 37.329-37.797 37.329h-15.266c-16.654.095-30.204 13.291-30.869 29.805h-.051l-.041-.772c-1.048-16.151-14.435-28.939-30.829-29.033h-15.266c-20.084 0-36.51-15.664-37.728-35.442-20.659-.253-37.328-17.079-37.328-37.798v-15.266C29.709 165.262 16.513 151.712 0 151.047v-.051c16.513-.665 29.71-14.216 29.805-30.87V104.86c0-20.084 15.663-36.51 35.441-37.728.254-20.659 17.08-37.327 37.798-37.327l14.902-.001h.364c16.654-.095 30.205-13.29 30.87-29.804h.05Z"/>

    <!-- Sheen overlay -->
    <path fill="url(#sheenGrad)"
      transform="translate(150.1,150.1) scale(0.918) translate(-150.1,-150.1)"
      d="M149.23 0c.666 16.513 14.216 29.708 30.87 29.804H195.365c20.084 0 36.51 15.664 37.729 35.441 20.659.253 37.328 17.079 37.328 37.798l.001 14.902-.001.182.001.182c.095 16.654 13.29 30.205 29.804 30.87v.05c-16.514.665-29.709 14.216-29.804 30.87l-.001.063v.224l.001.077-.001 14.901c0 20.085-15.664 36.511-35.442 37.729-.253 20.659-17.078 37.329-37.797 37.329h-15.266c-16.654.095-30.204 13.291-30.869 29.805h-.051l-.041-.772c-1.048-16.151-14.435-28.939-30.829-29.033h-15.266c-20.084 0-36.51-15.664-37.728-35.442-20.659-.253-37.328-17.079-37.328-37.798v-15.266C29.709 165.262 16.513 151.712 0 151.047v-.051c16.513-.665 29.71-14.216 29.805-30.87V104.86c0-20.084 15.663-36.51 35.441-37.728.254-20.659 17.08-37.327 37.798-37.327l14.902-.001h.364c16.654-.095 30.205-13.29 30.87-29.804h.05Z"/>
  </g>

  <!-- Bright highlight stroke on top-left edge -->
  <path stroke="#FFE97A" stroke-opacity="0.6" stroke-width="1.2"
    fill="none"
    d="M149.23 0c.666 16.513 14.216 29.708 30.87 29.804H195.365c20.084 0 36.51 15.664 37.729 35.441 20.659.253 37.328 17.079 37.328 37.798l.001 14.902-.001.182.001.182c.095 16.654 13.29 30.205 29.804 30.87v.05c-16.514.665-29.709 14.216-29.804 30.87l-.001.063v.224l.001.077-.001 14.901c0 20.085-15.664 36.511-35.442 37.729-.253 20.659-17.078 37.329-37.797 37.329h-15.266c-16.654.095-30.204 13.291-30.869 29.805h-.051l-.041-.772c-1.048-16.151-14.435-28.939-30.829-29.033h-15.266c-20.084 0-36.51-15.664-37.728-35.442-20.659-.253-37.328-17.079-37.328-37.798v-15.266C29.709 165.262 16.513 151.712 0 151.047v-.051c16.513-.665 29.71-14.216 29.805-30.87V104.86c0-20.084 15.663-36.51 35.441-37.728.254-20.659 17.08-37.327 37.798-37.327l14.902-.001h.364c16.654-.095 30.205-13.29 30.87-29.804h.05Z"/>

</svg>
